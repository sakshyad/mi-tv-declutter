name: Build launcher variants

on:
  push:
    branches: [main]
    tags: ["v2.*"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        variant: [v2, v3]
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"
      - name: Check shell syntax
        run: |
          for script in *.sh ci/*.sh; do sh -n "$script"; done
      - name: Install Android SDK packages
        run: yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" "platforms;android-34" "build-tools;34.0.0" >/dev/null
      - name: Build
        env:
          VARIANT: ${{ matrix.variant }}
        run: sh build.sh
      - uses: actions/upload-artifact@v4
        with:
          name: mi-tv-declutter-${{ matrix.variant }}
          path: out/tvhome.apk
